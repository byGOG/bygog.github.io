<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <script>(function(){var s=localStorage.getItem('theme');if(!s){s=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}document.documentElement.setAttribute('data-theme',s);document.documentElement.classList.add('js');var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=s==='light'?'#f5f5f5':'#0a0a0a';})();</script>

  <meta name="twitter:card" content="summary" />

  <meta name="twitter:description" content="Önder GÖG'ün notları ve yazıları." />

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Tektur:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=1.2" />
</head>

<body>

  <div class="bg" aria-hidden="true">
    <div class="bg__orb bg__orb--1"></div>
    <div class="bg__orb bg__orb--2"></div>
    <div class="bg__shapes">
      <span class="bg__shape bg__shape--ring"></span>
      <span class="bg__shape bg__shape--square"></span>
      <span class="bg__shape bg__shape--dot"></span>
      <span class="bg__shape bg__shape--plus">
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="4" x2="12" y2="20"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
      </span>
      <span class="bg__shape bg__shape--triangle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,3 21,20 3,20"/></svg>
      </span>
    </div>
    <div class="bg__noise"></div>
  </div>

  <nav class="site-nav site-nav--scrolled" aria-label="Ana gezinme">
    <a class="site-nav__logo" href="/">byGOG</a>
    <div class="site-nav__links">
      <a class="site-nav__link" href="/#projeler" data-i18n="nav.projects">Projeler</a>
      <a class="site-nav__link" href="/notlar.html" data-i18n="nav.notes">Notlar</a>

    </div>
    <div class="site-nav__controls">

      <button class="language-toggle" type="button" aria-label="Switch to English" data-language-toggle>EN</button>

      <button class="theme-toggle" type="button" aria-label="Temayı değiştir">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button class="nav-toggle" type="button" aria-label="Menüyü aç" aria-expanded="false">
        <svg class="nav-toggle__icon nav-toggle__icon--open" viewBox="0 0 24 24" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
        <svg class="nav-toggle__icon nav-toggle__icon--close" viewBox="0 0 24 24" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </nav>

  <main class="section-notes">
    <div class="section__inner">
      <header class="section__header">
        <span class="section__num" aria-hidden="true">03</span>
        <h1 class="section__title" data-i18n="nav.notes">Notlar</h1>
        <span class="section__line" aria-hidden="true"></span>
      </header>

      <section class="notes-tools" id="notes-tools" aria-label="Notlarda ara ve filtrele">
        <label class="notes-search">
          <span class="sr-only">Notlarda ara</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
          <input id="notes-search" type="search" placeholder="Notlarda ara…" data-i18n-placeholder="notes.search" autocomplete="off" />
          <kbd>Ctrl K</kbd>
        </label>
        <div class="notes-filters" id="notes-filters" role="group" aria-label="Kategoriler"></div>
        <p class="notes-results" id="notes-results" aria-live="polite"></p>
      </section>

      <ul class="notes-list" id="notes-list"></ul>

      <article class="note-reader" id="note-reader" hidden>
        <a class="note-reader__back" href="/notlar.html">← Tüm notlar</a>
        <p class="note-reader__meta" id="note-reader-meta"></p>
        <nav class="note-toc" id="note-toc" aria-label="İçindekiler" hidden>
          <strong data-i18n="notes.toc">İçindekiler</strong>
          <ol></ol>
        </nav>
        <div class="prose" id="note-content"></div>
        <div class="note-share" id="note-share" hidden>
          <span data-i18n="notes.share">Paylaş</span>
          <button type="button" data-share-native data-i18n="notes.share">Paylaş</button>
          <button type="button" data-share-copy data-i18n="notes.copy">Bağlantıyı kopyala</button>
          <a data-share-whatsapp target="_blank" rel="noopener">WhatsApp</a>
          <a data-share-x target="_blank" rel="noopener">X</a>
          <a data-share-linkedin target="_blank" rel="noopener">LinkedIn</a>
        </div>
        <nav class="note-pagination" id="note-pagination" aria-label="Diğer notlar"></nav>
        <a class="note-back-top" href="#" data-i18n="notes.backTop">↑ Başa dön</a>
      </article>
    </div>
  </main>

  <script src="vendor/marked.min.js" defer></script>
  <script src="script.js"></script>
  <script src="app.js?v=1.5" defer></script>
  <script>
    (function () {
      function setMeta(selector, value) {
        var el = document.querySelector(selector);
        if (el) el.setAttribute('content', value);
      }
      function updatePostMeta(post, url) {
        document.title = post.title + ' | byGOG';
        var descMeta = document.querySelector('meta[name="description"]');
        if (descMeta && post.excerpt) descMeta.content = post.excerpt;
        setMeta('meta[property="og:title"]', post.title + ' | byGOG');
        setMeta('meta[property="og:url"]', url);
        setMeta('meta[property="og:type"]', 'article');
        setMeta('meta[name="twitter:title"]', post.title + ' | byGOG');
        if (post.excerpt) {
          setMeta('meta[property="og:description"]', post.excerpt);
          setMeta('meta[name="twitter:description"]', post.excerpt);
        }
        // BlogPosting JSON-LD
        var ld = {
          '@context': 'https://schema.org',
          '@type': 'BlogPosting',
          headline: post.title,
          datePublished: post.date,
          dateModified: post.date,
          author: { '@type': 'Person', name: 'Önder GÖG', url: 'https://bygog.github.io' },
          mainEntityOfPage: url,
          image: 'https://bygog.github.io/profil-opt.jpg',
          description: post.excerpt || ''
        };
        var script = document.createElement('script');
        script.type = 'application/ld+json';
        script.textContent = JSON.stringify(ld);
        document.head.appendChild(script);
      }

      var param = new URLSearchParams(location.search).get('p');


      function waitForMarked(cb) {
        if (typeof marked !== 'undefined') { cb(); return; }
        var tries = 0;
        var t = setInterval(function () {
          if (typeof marked !== 'undefined' || ++tries > 60) {
            clearInterval(t); cb();
          }
        }, 50);
      }

      function slugifyHeading(text) {
        return text.toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9çğıöşü\s-]/g, '').trim().replace(/\s+/g, '-');
      }

      function enhanceReader(slug, markdown, content) {
        function readerText(key, fallback) { return window.siteText ? window.siteText(key, fallback) : fallback; }
        var words = markdown.trim().split(/\s+/).length;
        document.getElementById('note-reader-meta').textContent = readerText('notes.readTime', '{count} dk okuma').replace('{count}', Math.max(1, Math.ceil(words / 220)));

        var headings = Array.from(content.querySelectorAll('h2, h3'));
        var toc = document.getElementById('note-toc');
        var tocList = toc.querySelector('ol');
        headings.forEach(function (heading, index) {
          heading.id = heading.id || slugifyHeading(heading.textContent) || ('bolum-' + index);
          var item = document.createElement('li');
          if (heading.tagName === 'H3') item.className = 'note-toc__sub';
          var link = document.createElement('a');
          link.href = '#' + heading.id;
          link.textContent = heading.textContent;
          item.appendChild(link);
          tocList.appendChild(item);
        });
        toc.hidden = headings.length < 2;

        var share = document.getElementById('note-share');
        var shareUrl = location.href;
        var shareTitle = document.title;
        share.hidden = false;
        share.querySelector('[data-share-whatsapp]').href = 'https://wa.me/?text=' + encodeURIComponent(shareTitle + ' ' + shareUrl);
        share.querySelector('[data-share-x]').href = 'https://x.com/intent/post?text=' + encodeURIComponent(shareTitle) + '&url=' + encodeURIComponent(shareUrl);
        share.querySelector('[data-share-linkedin]').href = 'https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(shareUrl);
        var nativeButton = share.querySelector('[data-share-native]');
        nativeButton.hidden = !navigator.share;
        nativeButton.addEventListener('click', function () { navigator.share({ title: shareTitle, url: shareUrl }).catch(function () {}); });
        share.querySelector('[data-share-copy]').addEventListener('click', function (event) {
          navigator.clipboard.writeText(shareUrl).then(function () { event.currentTarget.textContent = readerText('notes.copied', 'Kopyalandı'); });
        });

        fetch('posts/index.json').then(function (r) { return r.json(); }).then(function (posts) {
          var index = posts.findIndex(function (post) { return post.slug === slug; });
          var pagination = document.getElementById('note-pagination');
          [[readerText('notes.previous', '← Önceki'), posts[index + 1]], [readerText('notes.next', 'Sonraki →'), posts[index - 1]]].forEach(function (entry) {
            if (!entry[1]) return;
            var link = document.createElement('a');
            link.href = '/notlar.html?p=' + encodeURIComponent(entry[1].slug);
            var label = document.createElement('span'); label.textContent = entry[0];
            var title = document.createElement('strong'); title.textContent = entry[1].title;
            link.append(label, title); pagination.appendChild(link);
          });
        }).catch(function () {});
      }

      if (param) {
        document.getElementById('notes-tools').hidden = true;
        document.getElementById('notes-list').hidden = true;
        var reader = document.getElementById('note-reader');
        reader.hidden = false;

        var postUrl = 'https://bygog.github.io/notlar.html?p=' + encodeURIComponent(param);

        // Meta/JSON-LD güncellemesi için index.json'dan yazı bilgisini çek
        fetch('posts/index.json')
          .then(function (r) { return r.ok ? r.json() : []; })
          .then(function (posts) {
            var post = (posts || []).find(function (p) { return p.slug === param; });
            if (post) updatePostMeta(post, postUrl);
          })
          .catch(function () {});

        fetch('posts/' + encodeURIComponent(param) + '.md')
          .then(function (r) { return r.ok ? r.text() : null; })
          .then(function (md) {
            var content = document.getElementById('note-content');
            if (!md) {
              content.textContent = 'Yazı bulunamadı.';
              return;
            }
            waitForMarked(function () {
              if (typeof marked !== 'undefined') {
                content.innerHTML = marked.parse(md);
              } else {
                content.textContent = md;
              }
              var h1 = content.querySelector('h1');
              if (h1) document.title = h1.textContent + ' | byGOG';
              enhanceReader(param, md, content);
            });
          })
          .catch(function () {
            document.getElementById('note-content').textContent =
              'Yüklenirken hata oluştu.';
          });
      } else {
        var categoryRules = [
          ['Güvenlik', /güvenlik|gizlilik|virüs|zararlı|defender|sandbox|vpn|dns|adblock|bitwarden|relay/i],
          ['Medya', /video|film|dizi|müzik|altyazı|jellyfin|stream|youtube|fotmob|rottentomatoes|one pace/i],
          ['İnternet', /tarayıcı|browser|internet|indirme|download|uzaktan|anydesk|drive|web|site/i],
          ['Yapay Zekâ', /yapay zek|\bai\b|chatgpt|arena/i],
          ['Windows', /windows|winget|powershell|sysinternals|powertoys|driver|bloatware|dosya|disk|donanım|temiz/i]
        ];

        function categoryFor(post) {
          var text = post.title + ' ' + (post.excerpt || '');
          for (var i = 0; i < categoryRules.length; i++) {
            if (categoryRules[i][1].test(text)) return categoryRules[i][0];
          }
          return 'Diğer';
        }

        function normalized(text) {
          return (text || '').toLocaleLowerCase('tr-TR');
        }

        var categoryKeys = {
          'Tümü': 'notes.all', 'Güvenlik': 'notes.security', 'İnternet': 'notes.internet',
          'Diğer': 'notes.other', 'Yapay Zekâ': 'notes.ai', 'Medya': 'notes.media'
        };
        function uiText(key, fallback) {
          return window.siteText ? window.siteText(key, fallback) : fallback;
        }
        function categoryLabel(category) {
          return categoryKeys[category] ? uiText(categoryKeys[category], category) : category;
        }

        fetch('posts/index.json')
          .then(function (r) { return r.json(); })
          .then(function (posts) {
            var list = document.getElementById('notes-list');
            if (!posts.length) {
              var empty = document.createElement('li');
              empty.className = 'note-item note-item--empty';
              empty.textContent = 'Henüz yazı yok.';
              list.appendChild(empty);
              return;
            }
            posts.forEach(function (post) { post.category = post.category || categoryFor(post); });
            var search = document.getElementById('notes-search');
            var filters = document.getElementById('notes-filters');
            var results = document.getElementById('notes-results');
            var activeCategory = 'Tümü';
            var categories = ['Tümü'].concat(Array.from(new Set(posts.map(function (post) { return post.category; }))));

            categories.forEach(function (category) {
              var button = document.createElement('button');
              button.type = 'button';
              button.className = 'notes-filter' + (category === 'Tümü' ? ' is-active' : '');
              button.dataset.category = category;
              button.textContent = categoryLabel(category);
              button.setAttribute('aria-pressed', category === 'Tümü' ? 'true' : 'false');
              button.addEventListener('click', function () {
                activeCategory = category;
                filters.querySelectorAll('.notes-filter').forEach(function (item) {
                  var selected = item === button;
                  item.classList.toggle('is-active', selected);
                  item.setAttribute('aria-pressed', selected ? 'true' : 'false');
                });
                renderPosts();
              });
              filters.appendChild(button);
            });

            function renderPosts() {
              var query = normalized(search.value.trim());
              var visible = posts.filter(function (post) {
                var categoryMatch = activeCategory === 'Tümü' || post.category === activeCategory;
                var text = normalized(post.title + ' ' + (post.excerpt || '') + ' ' + post.category);
                return categoryMatch && (!query || text.includes(query));
              });

              list.innerHTML = '';
              results.textContent = uiText('notes.count', '{count} not gösteriliyor').replace('{count}', visible.length);

              if (!visible.length) {
                var noResult = document.createElement('li');
                noResult.className = 'note-item note-item--empty';
                noResult.textContent = uiText('notes.empty', 'Aramana uygun bir not bulunamadı.');
                list.appendChild(noResult);
                return;
              }

              visible.forEach(function (post) {
              var li = document.createElement('li');
              li.className = 'note-item';

              var a = document.createElement('a');
              a.className = 'note-item__link';
              a.href = '/notlar.html?p=' + encodeURIComponent(post.slug);

              var titleEl = document.createElement('span');
              titleEl.className = 'note-item__title';
              titleEl.textContent = post.title;

              var categoryEl = document.createElement('span');
              categoryEl.className = 'note-item__category';
              categoryEl.textContent = post.category;

              var dateEl = document.createElement('time');
              dateEl.className = 'note-item__date';
              dateEl.dateTime = post.date;
              dateEl.textContent = new Date(post.date + 'T12:00:00').toLocaleDateString(
                'tr-TR',
                { year: 'numeric', month: 'long', day: 'numeric' }
              );

              a.appendChild(titleEl);
              a.appendChild(dateEl);
              li.appendChild(a);
              li.appendChild(categoryEl);

              if (post.excerpt) {
                var excerpt = document.createElement('p');
                excerpt.className = 'note-item__excerpt';
                excerpt.textContent = post.excerpt;
                li.appendChild(excerpt);
              }

              list.appendChild(li);
              });
            }

            search.addEventListener('input', renderPosts);
            document.addEventListener('site-language-change', function () {
              filters.querySelectorAll('.notes-filter').forEach(function (button) {
                button.textContent = categoryLabel(button.dataset.category);
              });
              renderPosts();
            });
            document.addEventListener('keydown', function (event) {
              if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
                event.preventDefault();
                search.focus();
              }
            });
            renderPosts();
          })
          .catch(function () {
            var list = document.getElementById('notes-list');
            var empty = document.createElement('li');
            empty.className = 'note-item note-item--empty';
            empty.textContent = 'Yazılar yüklenemedi.';
            list.appendChild(empty);
          });
      }
    })();
  </script>

</body>
